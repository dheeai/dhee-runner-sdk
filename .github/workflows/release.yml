name: Release

# Publish to npm via OIDC Trusted Publishing when a version tag is pushed (e.g. v0.1.1).
# No NPM_TOKEN secret — auth is a short-lived OIDC token verified against the
# package's trusted-publisher config on npmjs.com.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # mint the OIDC token for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `npm install -g npm@latest` below now resolves npm@12,
          # which declares `node: ^22.22.2 || ^24.15.0 || >=26.0.0` and fails
          # EBADENGINE on Node 20. The published package still supports Node
          # >=20 (see `engines`) — this is only the publishing toolchain, and
          # CI is what validates the supported runtime floor.
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - name: Install (runs build via prepare)
        run: npm install
      - name: Publish (OIDC trusted publishing)
        run: npm publish --access public --provenance
